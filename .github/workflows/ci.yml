name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

      - name: Build extension zip
        run: |
          sha="${GITHUB_SHA::7}"
          zip -r "lichess-analyzer-${sha}.zip" \
            manifest.json popup.html popup.css popup.js icons LICENSE README.md

      - uses: actions/upload-artifact@v4
        with:
          name: lichess-analyzer-unpacked
          path: |
            manifest.json
            popup.html
            popup.css
            popup.js
            icons/
            LICENSE
            README.md
          if-no-files-found: error
